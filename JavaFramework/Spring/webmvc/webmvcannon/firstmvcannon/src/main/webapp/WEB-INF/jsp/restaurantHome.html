<!DOCTYPE html>
<html>
<head>
    <title>Food Corner</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #fff8f0;
        }

        header {
            background: #8b0000;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav {
            background: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 45px;
            color: #8b0000;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .food {
            background: white;
            width: 200px;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 8px #ccc;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🍴 Food Corner</h1>
    <p>Delicious food, great taste</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<section class="hero">
    <h1>Welcome to Food Corner</h1>
    <p>Enjoy delicious food at affordable prices.</p>
    <button>View Menu</button>
</section>

<section class="menu">

    <div class="food">
        <h2>🍕</h2>
        <h3>Pizza</h3>
        <p>₹199</p>
    </div>

    <div class="food">
        <h2>🍔</h2>
        <h3>Burger</h3>
        <p>₹149</p>
    </div>

    <div class="food">
        <h2>🍝</h2>
        <h3>Pasta</h3>
        <p>₹179</p>
    </div>

</section>

<footer>
    <p>© 2026 Food Corner</p>
</footer>

</body>
</html>
